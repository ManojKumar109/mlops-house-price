
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }
        h1 { color: #1f4e79; }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        label { font-weight: bold; }
        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin-top: 5px;
        }
        button {
            grid-column: 1 / -1;
            padding: 12px;
            background: #1f4e79;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>House Price Prediction</h1>
    <p>Enter the property details to estimate its value.</p>

    <form id="predictionForm">
        <label>Median Income
            <input type="number" name="MedInc" step="any" value="5" required>
        </label>
        <label>House Age
            <input type="number" name="HouseAge" step="any" value="20" required>
        </label>
        <label>Average Rooms
            <input type="number" name="AveRooms" step="any" value="5" required>
        </label>
        <label>Average Bedrooms
            <input type="number" name="AveBedrms" step="any" value="1" required>
        </label>
        <label>Population
            <input type="number" name="Population" step="any" value="1000" required>
        </label>
        <label>Average Occupancy
            <input type="number" name="AveOccup" step="any" value="3" required>
        </label>
        <label>Latitude
            <input type="number" name="Latitude" step="any" value="34" required>
        </label>
        <label>Longitude
            <input type="number" name="Longitude" step="any" value="-118" required>
        </label>
        <button type="submit">Predict House Price</button>
    </form>

    <div id="result"></div>

    <script>
        const form = document.getElementById("predictionForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            result.textContent = "Predicting...";

            const data = Object.fromEntries(
                [...new FormData(form)].map(([key, value]) => [
                    key, Number(value)
                ])
            );

            try {
                const response = await fetch("/prediction", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(data)
                });

                const output = await response.json();

                if (!response.ok) {
                    throw new Error(output.error || "Prediction failed");
                }

                result.textContent =
                    "Estimated House Value: ₹" +
output.predicted_house_value.toLocaleString("en-IN");
            } catch (error) {
                result.textContent = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
